name: Build macOS (Apple Silicon)

# Fork build of the desktop client with self-hosted sharing.
# Branch pushes and manual runs upload the DMG as a workflow artifact;
# a v* tag also publishes it to a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: [tt/main, "feat/**"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15 # arm64 runner
    timeout-minutes: 45
    env:
      # No Apple Developer certificate: ad-hoc sign (required for arm64 binaries to launch), no notarization.
      # Hardened runtime is off: it only matters for notarization, and with ad-hoc signing its library
      # validation can refuse the bundled onnxruntime dylib at load time.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # github.com release downloads intermittently return 504; fall back to a mirror.
      # @electron/get still verifies the archive against the package's checksums.json.
      - name: Electron runtime
        run: |
          for mirror in "" "https://npmmirror.com/mirrors/electron/"; do
            if ELECTRON_MIRROR="$mirror" node node_modules/electron/install.js && node scripts/ensure-electron.cjs; then exit 0; fi
            echo "Electron download failed${mirror:+ via $mirror}; retrying"
          done
          exit 1
      - name: Package DMG
        run: |
          pack() { npm run desktop:pack -- --mac dmg --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false; }
          pack || ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/ pack
      - name: Checksums
        working-directory: release
        run: shasum -a 256 *.dmg | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EasyDraw-Local-mac-arm64
          path: |
            release/*.dmg
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg release/SHA256SUMS.txt --title "EasyDraw Local $GITHUB_REF_NAME (self-hosted share)" --generate-notes
