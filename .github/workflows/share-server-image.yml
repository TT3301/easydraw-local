name: Share server image (GHCR)

# Multi-arch image of the self-hosted share server with the viewer baked in.
#   tt/main  -> ghcr.io/<owner>/easydraw-share:latest, :sha-<short>
#   v1.2.3   -> :1.2.3, :1.2
on:
  workflow_dispatch:
  push:
    branches: [tt/main]
    tags: ["v*"]
    paths:
      - "apps/share-server/**"
      - "src/**"
      - "packages/**"
      - "viewer.html"
      - "vite.viewer.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/share-server-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: share-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/easydraw-share" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/tt/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/tt/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/share-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
